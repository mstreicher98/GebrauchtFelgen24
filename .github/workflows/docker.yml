name: Docker-Image

# Baut das Produktions-Image und legt es in der GitHub Container Registry ab:
#   ghcr.io/mstreicher98/gebrauchtfelgen24:latest   (Branch main)
#   ghcr.io/mstreicher98/gebrauchtfelgen24:<branch>  (andere Branches)
#   ghcr.io/mstreicher98/gebrauchtfelgen24:v1.2.3   (Git-Tags)
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mstreicher98/gebrauchtfelgen24
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
